Voter ID paradox: If only citizens can vote, why isn't a voter ID accepted as proof of citizenship? The argument that "fakes exist" applies equally to passports — so by that logic, no document qualifies. Either we trust the system or we don't.
"Horn OK Please" and diesel history: During WW2, Britain redirected India's diesel to Europe. India switched to kerosene for trucks — which was volatile and caused accidents. The "OK" was a safety warning to maintain distance. A colonial footnote that's been on millions of trucks for decades.
UK's Prime Minister problem: Britain now has an annual tradition of replacing a bad PM with a worse one. It's not a political cycle anymore — it's managed decline with better branding.
Sovereign AI is a national security issue: Countries without their own LLMs will be dependent on foreign models for government, defence, and media. The nation that controls the model shapes the output — and the narrative.
The case for a Shashi Tharoor-trained LLM: Half joke, full insight — an LLM's quality depends heavily on the quality of its training data. A model trained on genuinely sophisticated language would perform differently. We underinvest in linguistic diversity in AI.
Get your data off the cloud: Centralised cloud dependency is a geopolitical and privacy risk. What feels like convenience is actually a single point of failure — for individuals and for nations.
Distance to work affects quality of life more than almost anything else: More than salary, more than office perks. A 90-minute commute each way is a tax on your health, relationships, and time that no bonus compensates for.
The 120–135 IQ trap: Smart enough to see all the problems, not powerful enough to solve them alone. The "slightly too smart" bracket is genuinely hard — you lose the comfort of ignorance without gaining the leverage of genius.
Airports need a post office: You shouldn't have to throw away a full bottle of expensive perfume or discard a gift because of liquid restrictions. A simple mail-home service at security would be obvious if anyone actually thought about traveller experience.
LinkedIn first-timers: The gap between how LinkedIn presents professional life and what professional life actually feels like is one of the great unacknowledged comedies of modern work.

const _ts = new Set();
const TP = TPRAW.split("\n").map(x => x.trim()).filter(Boolean).filter(x => { const k = x.toLowerCase(); if (_ts.has(k)) return false; _ts.add(k); return true; });
const LISTS = { words: WORDS, quotes: QUOTES, tp: TP };
const pos = { words: 0, quotes: 0, tp: 0 };
const LABEL = { words: "Word", quotes: "Quote", tp: "Item" };
let original = items.slice();
function setMode(m) {
  if (m === mode) return;
  pos[mode] = Math.max(0, original.indexOf(items[i]));
  mode = m;
  items = LISTS[m].slice();
  original = items.slice();
  i = pos[m];
  qEl.value = ""; sEl.hidden = true; qEl.blur();
  qEl.placeholder = "Search " + (m === "words" ? "words and phrases" : m === "quotes" ? "quotes" : "TP") + "…";
  document.getElementById("tw").classList.toggle("on", m === "words");
  document.getElementById("tq").classList.toggle("on", m === "quotes");
  document.getElementById("tt").classList.toggle("on", m === "tp");
  show();
}
let i = 0;
const w = document.getElementById("w"), c = document.getElementById("c");

function show() {
  const t = items[i];
  w.textContent = t;
  document.getElementById("m").textContent = mode === "words" ? (MEAN[t.toLowerCase()] || "") : "";
  const n = t.length;
  let vw = n <= 8 ? 14 : n <= 16 ? 10 : n <= 30 ? 6.5 : n <= 60 ? 4.2 : n <= 110 ? 3.2 : n <= 180 ? 2.6 : n <= 260 ? 2.2 : 1.9;
  w.style.fontSize = "min(" + vw + "vw, " + (vw * 1.1) + "vh)";
  if (window.innerWidth < 700) w.style.fontSize = (n <= 8 ? 15 : n <= 16 ? 11 : n <= 30 ? 8 : n <= 60 ? 6 : n <= 110 ? 4.6 : n <= 180 ? 4.2 : 3.8) + "vw";
  c.textContent = LABEL[mode] + " " + (i + 1) + " of " + items.length;
}
function next() { i = (i + 1) % items.length; show(); }
function skip(d) { i = Math.min(Math.max(i + d, 0), items.length - 1); show(); }

const resEl = document.getElementById("res"), sEl = resEl, qEl = document.getElementById("q");
let hits = [], act = 0;
function renderS() {
  const t = qEl.value.trim().toLowerCase();
  hits = []; act = 0;
  if (!t) { sEl.hidden = true; return; }
  for (let k = 0; k < items.length; k++) if (items[k].toLowerCase().includes(t)) hits.push(k);
  sEl.hidden = false; drawS();
}
function drawS() {
  resEl.innerHTML = "";
  const info = document.createElement("div");
  info.style.cssText = "font:13px system-ui,sans-serif;color:var(--mute);padding:4px 12px";
  info.textContent = hits.length + " match" + (hits.length === 1 ? "" : "es") + (hits.length > 200 ? " (showing first 200)" : "");
  resEl.appendChild(info);
  hits.slice(0, 200).forEach((k, n) => {
    const d = document.createElement("div");
    d.className = "it" + (n === act ? " on" : "");
    const num = document.createElement("span"); num.textContent = k + 1;
    const tx = document.createElement("div"); tx.textContent = items[k];
    d.append(num, tx); d.onclick = () => goS(k); resEl.appendChild(d);
  });
}
function goS(k) { i = k; qEl.value = ""; closeS(); show(); }
function openS() { qEl.focus(); qEl.select(); }
function closeS() { sEl.hidden = true; qEl.blur(); }
function scrollAct() { const el = resEl.querySelector(".on"); if (el) el.scrollIntoView({ block: "nearest" }); }
function searchKey(e) {
  const m = Math.min(hits.length, 200);
  if (e.key === "Escape") { e.preventDefault(); closeS(); }
  else if (e.key === "Enter") { e.preventDefault(); if (hits.length) goS(hits[act]); }
  else if (e.key === "ArrowDown") { e.preventDefault(); act = Math.max(0, Math.min(act + 1, m - 1)); drawS(); scrollAct(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); act = Math.max(act - 1, 0); drawS(); scrollAct(); }
}
qEl.addEventListener("input", renderS);
qEl.addEventListener("focus", renderS);
function prev() { i = (i - 1 + items.length) % items.length; show(); }
function shuffle() {
  if (items[0] === original[0] && items.join() === original.join()) {
    for (let a = items.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [items[a], items[b]] = [items[b], items[a]]; }
  } else items = original.slice();
  i = 0; show();
}
document.addEventListener("keydown", e => {
  if (document.activeElement === qEl) { searchKey(e); return; }
  if (e.key === "/" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f")) { e.preventDefault(); openS(); return; }
  if (e.code === "Space") { e.preventDefault(); e.shiftKey ? prev() : next(); }
  else if (e.key === "ArrowRight" || e.key === "Enter") next();
  else if (e.key === "ArrowLeft" || e.key === "Backspace") prev();
  else if (e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); skip(50); }
  else if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); skip(-50); }
  else if (e.key.toLowerCase() === "s") shuffle();
});
document.body.addEventListener("click", () => { if (!sEl.hidden || document.activeElement === qEl) { closeS(); return; } next(); });
window.addEventListener("resize", show);
show();
